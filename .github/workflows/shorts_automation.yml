name: Omar Cartoon Automation - Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test GitHub Video Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Create output folder
        run: |
          mkdir -p output

      - name: Create test 9:16 video
        run: |
          ffmpeg \
            -f lavfi \
            -i "color=c=0xEAF4FF:s=1080x1920:d=5" \
            -f lavfi \
            -i "anullsrc=r=44100:cl=mono" \
            -t 5 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            output/omar_test.mp4

      - name: Check generated video
        run: |
          ls -lh output/omar_test.mp4
          ffprobe output/omar_test.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: omar-test-video
          path: output/omar_test.mp4
          retention-days: 3
